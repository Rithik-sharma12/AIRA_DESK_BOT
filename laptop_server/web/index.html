<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5DC">
<title>AIRA</title>
<style>
  /* AIRA web: neo-brutalist design system — thick black strokes, squared corners, solid accent
     blocks, hard shadows, strict grid, high contrast, focus always visible, 44px hit areas. */
  :root {
    --teal:#00C2CB; --magenta:#FF00FF; --yellow:#FFD700; --black:#000; --white:#fff; --paper:#F5F5DC;
    --ink:#000; --muted:#4a4a40; --line:3px solid #000; --r:4px;
    --sh0:none; --sh1:4px 4px 0 #000; --sh2:8px 8px 0 #000;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --font:"Archivo","Inter","Segoe UI","Roboto","Helvetica Neue",Arial,"Noto Sans Tamil",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:500 16px/1.45 var(--font); }
  body { display:flex; flex-direction:column; padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom)); }
  :focus-visible { outline:3px solid var(--yellow); outline-offset:2px; box-shadow:0 0 0 6px #000; }
  button { font:800 14px/1 var(--font); text-transform:uppercase; letter-spacing:.04em; color:var(--ink);
           background:var(--white); border:var(--line); border-radius:var(--r); box-shadow:var(--sh1);
           min-height:44px; padding:0 var(--s4); cursor:pointer; touch-action:manipulation;
           transition:transform .06s, box-shadow .06s; }
  button:hover { background:#fffbe6; }
  button:active { transform:translate(4px,4px); box-shadow:none; }
  button:disabled { opacity:.45; cursor:default; transform:none; box-shadow:var(--sh1); }
  button.icon { width:44px; padding:0; display:inline-grid; place-items:center; }
  svg.i { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:square; stroke-linejoin:miter; }

  /* header */
  header { display:flex; align-items:center; gap:var(--s3); padding-bottom:var(--s3); border-bottom:var(--line); }
  .logo { font:900 32px/1 var(--font); letter-spacing:-.02em; text-transform:uppercase; }
  .tag { font:800 11px/1 var(--font); text-transform:uppercase; letter-spacing:.06em; border:2px solid #000;
         border-radius:var(--r); padding:5px 7px; background:var(--white); white-space:nowrap; }
  #statusWrap { flex:1; min-width:0; display:flex; align-items:center; gap:var(--s2); }
  .dot { width:12px; height:12px; flex:none; border:2px solid #000; background:var(--white); }
  .dot.ok { background:var(--teal); } .dot.warn { background:var(--yellow); } .dot.bad { background:var(--magenta); }
  #status { font:700 12px/1.2 var(--font); text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* layout: stage (mascot) + talk (conversation) */
  main { flex:1; min-height:0; display:grid; gap:var(--s4); padding-top:var(--s4); grid-template-columns:minmax(0,1fr);
         grid-template-rows:auto minmax(0,1fr); }
  main > * { min-width:0; }
  @media (min-width:900px) { main { grid-template-columns:340px minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:var(--s5); }
                             .stage { position:sticky; top:0; align-self:start; } }
  .stage { display:flex; flex-direction:column; gap:var(--s3); }
  #face { position:relative; background:#0d0820; border:var(--line); border-radius:var(--r); box-shadow:var(--sh2);
          overflow:hidden; aspect-ratio:5/4; width:min(calc(100% - 8px), calc(26vh * 1.25)); margin:0 auto; }
  @media (min-width:900px) { #face { width:calc(100% - 8px); margin:0; } }
  #mascot { display:block; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
  #stateTag { position:absolute; left:var(--s2); bottom:var(--s2); }
  #face.idle #stateTag { background:var(--white); }
  #face.listening #stateTag { background:var(--teal); }
  #face.thinking #stateTag { background:var(--yellow); }
  #face.speaking #stateTag { background:var(--white); }
  #face.error #stateTag { background:var(--magenta); color:#000; }
  #face.listening { box-shadow:8px 8px 0 var(--teal), 8px 8px 0 3px #000; }
  #piTag { color:var(--muted); } #piTag.on { background:var(--teal); color:#000; }
  .quick button[aria-pressed="true"] { background:var(--teal); }
  .quick { display:none; flex-wrap:wrap; gap:var(--s2); }
  .quick button { min-height:36px; font-size:12px; padding:0 var(--s3); }
  @media (min-width:900px) { .quick { display:flex; } }
  .section-title { display:none; font:900 13px/1 var(--font); text-transform:uppercase; letter-spacing:.08em; margin:var(--s2) 0 0; }
  @media (min-width:900px) { .section-title { display:block; } }

  /* conversation */
  .talk { display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:var(--s2) 12px var(--s3) 2px; display:flex; flex-direction:column; gap:var(--s3); min-height:120px; }
  .msg { max-width:86%; padding:var(--s3) var(--s4); border:var(--line); border-radius:var(--r); white-space:pre-wrap;
         word-wrap:break-word; box-shadow:var(--sh1); font-weight:500; }
  .msg.user { align-self:flex-end; background:var(--yellow); }
  .msg.aira { align-self:flex-start; background:var(--white); }
  .msg.aira::before { content:"AIRA"; display:block; font:900 11px/1 var(--font); letter-spacing:.08em; margin-bottom:6px; color:var(--black); }
  .msg.user::before { content:"YOU"; display:block; font:900 11px/1 var(--font); letter-spacing:.08em; margin-bottom:6px; }
  .msg.note { align-self:center; max-width:94%; color:var(--muted); font:600 12.5px/1.35 var(--font); background:none; border:none;
              box-shadow:none; padding:2px 8px; text-align:center; }
  .msg.interim { opacity:.6; font-style:italic; }
  .msg.reminder { align-self:stretch; max-width:none; background:var(--magenta); font-weight:800; }
  .msg.reminder::before { content:"REMINDER"; display:block; font:900 11px/1 var(--font); letter-spacing:.08em; margin-bottom:6px; }
  .meta { display:block; color:var(--muted); font:600 11.5px/1.3 var(--font); text-transform:uppercase; letter-spacing:.04em; margin-top:8px; }
  .chip { display:inline-block; font:800 11px/1 var(--font); text-transform:uppercase; letter-spacing:.05em; color:#000;
          background:var(--teal); border:2px solid #000; border-radius:var(--r); padding:5px 7px; margin:8px 6px 0 0; }
  .chip.fail { background:var(--magenta); }
  .confirm { display:flex; gap:var(--s3); margin-top:var(--s3); }
  .confirm button { flex:1; }
  .confirm .yes { background:var(--teal); }

  /* controls */
  #meter { height:14px; background:var(--white); border:var(--line); border-radius:var(--r); margin:var(--s3) 8px 0 0; overflow:hidden; }
  #meter div { height:100%; width:0; background:var(--teal); border-right:3px solid #000; transition:width .05s; }
  #controls { display:flex; align-items:stretch; gap:var(--s3); margin:var(--s3) 8px 0 0; }
  #mic { width:64px; min-height:64px; padding:0; flex:none; background:var(--teal); box-shadow:var(--sh2); display:grid; place-items:center; }
  #mic svg.i { width:28px; height:28px; }
  #mic.rec { background:var(--magenta); animation:pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { box-shadow:4px 4px 0 #000; transform:translate(4px,4px); } }
  #textrow { flex:1; min-width:0; display:flex; gap:var(--s3); }
  #text { flex:1; min-width:0; font:600 16px/1.2 var(--font); color:var(--ink); background:var(--white); border:var(--line);
          border-radius:var(--r); padding:0 var(--s4); min-height:64px; box-shadow:var(--sh1); }
  #text::placeholder { color:#8a8a7a; text-transform:uppercase; font-size:13px; letter-spacing:.05em; font-weight:800; }
  #send { width:64px; min-height:64px; padding:0; background:var(--yellow); display:grid; place-items:center; }
  #hint { color:var(--muted); font:700 11.5px/1.3 var(--font); text-transform:uppercase; letter-spacing:.04em; margin-top:var(--s3); text-align:center; min-height:15px; }

  /* modals */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:5; padding:var(--s4); }
  .sheet.open { display:flex; }
  .card { width:100%; max-width:480px; max-height:92vh; overflow:auto; background:var(--paper); border:var(--line); border-radius:var(--r);
          box-shadow:12px 12px 0 #000; padding:var(--s5); }
  .card h2 { margin:0 0 var(--s3); font:900 22px/1.1 var(--font); text-transform:uppercase; }
  .card p { margin:0 0 var(--s3); color:var(--muted); font-weight:600; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin:var(--s3) 0; }
  .row label { font:800 12px/1.2 var(--font); text-transform:uppercase; letter-spacing:.04em; }
  select, .card input { font:600 15px/1.2 var(--font); color:var(--ink); background:var(--white); border:var(--line);
                        border-radius:var(--r); padding:0 10px; min-height:44px; }
  input[type=checkbox] { width:26px; height:26px; min-height:26px; accent-color:#000; }
  input[type=range] { accent-color:#000; min-height:auto; border:none; background:none; }
  #code { width:100%; font:900 34px/1 var(--font); letter-spacing:12px; text-align:center; margin:var(--s2) 0 var(--s3); min-height:64px; }
  #pairMsg { color:var(--muted); font:700 12.5px/1.3 var(--font); min-height:18px; margin-top:var(--s2); }
  .primary { background:var(--teal); width:100%; min-height:52px; font-size:16px; }
  #forgetBtn { background:var(--magenta); }
  #capsInfo { color:var(--muted); font:600 12.5px/1.35 var(--font); }
</style>
</head>
<body>
<header>
  <span class="logo">AIRA</span>
  <div id="statusWrap"><span class="dot" id="dot"></span><span id="status">starting…</span></div>
  <span class="tag" id="piTag" title="AIRA's Raspberry Pi screen: not connected">Pi screen</span>
  <button class="icon" id="newBtn" title="New conversation" aria-label="New conversation">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
  <button class="icon" id="setBtn" title="Settings" aria-label="Settings">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><rect x="14" y="5" width="4" height="4"/><rect x="6" y="15" width="4" height="4"/></svg></button>
</header>

<main>
  <section class="stage" aria-label="AIRA">
    <div id="face" class="idle">
      <img id="mascot" src="/mascot/idle/frame_00.png" alt="AIRA, your desk companion">
      <span class="tag" id="stateTag">Ready</span>
    </div>
    <p class="section-title">Quick actions</p>
    <div class="quick" id="quick">
      <button data-say="How is my laptop doing?">Laptop status</button>
      <button data-say="volume up">Volume up</button>
      <button data-say="pause the music">Play / pause</button>
      <button data-say="set a timer for 5 minutes">Timer 5 min</button>
      <button data-say="what reminders do I have?">Reminders</button>
      <button data-say="lock the laptop">Lock</button>
    </div>
    <p class="section-title">AIRA's screen (Pi)</p>
    <div class="quick" id="piScreens" title="Show this screen on the Raspberry Pi">
      <button data-screen="home" disabled>Home</button>
      <button data-screen="chat" disabled>Chat</button>
      <button data-screen="music" disabled>Music</button>
      <button data-screen="tools" disabled>Tools</button>
      <button data-screen="emotions" disabled title="Plays through all of AIRA's emotions">Emotions</button>
      <button data-screen="about" disabled>About</button>
      <button data-screen="system" disabled>System</button>
    </div>
  </section>

  <section class="talk" aria-label="Conversation">
    <div id="log" aria-live="polite"></div>
    <div id="meter" aria-hidden="true"><div></div></div>
    <div id="controls">
      <button id="mic" title="Talk (space)" aria-label="Talk">
        <svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
      <div id="textrow">
        <input id="text" placeholder="Or type to AIRA…" autocomplete="off" enterkeyhint="send" aria-label="Message">
        <button id="send" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div id="hint"></div>
  </section>
</main>

<div class="sheet" id="pairSheet">
  <div class="card" role="dialog" aria-labelledby="pairTitle">
    <h2 id="pairTitle">Pair this browser</h2>
    <p>Enter the 6-digit code shown in the AIRA server window on the laptop.</p>
    <input id="code" inputmode="numeric" maxlength="7" placeholder="000000" autocomplete="one-time-code" aria-label="Pairing code">
    <input id="devname" placeholder="Name for this device (e.g. Redmi)" maxlength="40" style="width:100%" aria-label="Device name">
    <div id="pairMsg"></div>
    <button class="primary" id="pairBtn" style="margin-top:16px">Pair</button>
  </div>
</div>

<div class="sheet" id="setSheet">
  <div class="card" role="dialog" aria-labelledby="setTitle">
    <h2 id="setTitle">Settings</h2>
    <div class="row"><label for="sttSel">Speech recognition</label>
      <select id="sttSel"><option value="auto">Auto</option><option value="server">Server (Whisper)</option><option value="browser">Browser</option></select></div>
    <div class="row"><label for="ttsSel">AIRA's voice</label>
      <select id="ttsSel"><option value="auto">Auto</option><option value="server">Server (Azure/Piper)</option><option value="browser">Browser</option><option value="off">Off (text only)</option></select></div>
    <div class="row"><label for="langSel">I'll speak</label>
      <select id="langSel"><option value="auto">Auto (English + Tamil)</option><option value="en">English</option><option value="ta">Tamil / Tanglish</option></select></div>
    <div class="row"><label for="autoStop">Stop recording when I pause</label><input type="checkbox" id="autoStop" checked></div>
    <div class="row"><label for="convo">Keep listening after AIRA replies</label><input type="checkbox" id="convo"></div>
    <div class="row"><label for="rate">Browser voice speed</label><input type="range" id="rate" min="0.8" max="1.6" step="0.05" value="1.1"></div>
    <div class="row" id="capsInfo"></div>
    <div class="row"><button id="forgetBtn">Forget device</button><button id="closeSet">Done</button></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const TOKEN = "aira-web-token", PREFS = "aira-web-prefs";
  const state = { token: localStorage.getItem(TOKEN), caps: { stt: null, tts: null }, session: null,
                  busy: false, recording: false, abort: null, speakQueue: Promise.resolve(), speakGen: 0, audio: null,
                  ttsFails: 0, voiceUsed: "" };
  const prefs = Object.assign({ stt: "auto", tts: "auto", lang: "auto", autoStop: true, convo: false, rate: 1.1 },
                              JSON.parse(localStorage.getItem(PREFS) || "{}"));
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ------------------------------------------------------------------ ui helpers
  function status(text, cls) { $("status").textContent = text; $("dot").className = "dot " + (cls || ""); }
  // ------------------------------------------------------------------ mascot
  // Same sprites as the Raspberry Pi screen (served from raspberry_pi/aira_pi/assets/mascot).
  const STATE_TAG = { idle: "Ready", listening: "Listening", thinking: "Thinking", speaking: "Speaking", error: "Error" };
  const MOOD_TAG = { happy: "Done!", excited: "Reminder", confused: "Hmm?", sleepy: "Sleepy" };
  const mascot = { m: null, mood: null, moodUntil: 0, lastActive: performance.now(), nextBlink: performance.now() + 3000, cur: "" };
  function mood(name, ms) { mascot.mood = name; mascot.moodUntil = performance.now() + ms; }
  function emotionNow(now) {
    const s = $("face").className;
    if (s !== "idle") return s;
    if (mascot.mood && now < mascot.moodUntil) return mascot.mood;
    return now - mascot.lastActive > 180000 ? "sleepy" : "idle";
  }
  function mascotTick() {
    const now = performance.now(), m = mascot.m;
    const name = emotionNow(now), e = m.emotions[name] ? name : "idle", spec = m.emotions[e];
    let f = spec.frames[Math.floor(now / 1000 * spec.fps) % spec.frames.length];
    if (spec.blink && spec.blink.length) {                       // a natural blink every few seconds
      if (now >= mascot.nextBlink + spec.blink.length / 14 * 1000) {
        mascot.nextBlink = now + 2500 + Math.random() * 3500;
        if (Math.random() < 0.15) mascot.nextBlink = now + 450;
      }
      const k = Math.floor((now - mascot.nextBlink) / 1000 * 14);
      if (k >= 0 && k < spec.blink.length) f = spec.blink[k];
    }
    const src = `/mascot/${e}/${f}`;
    if (src !== mascot.cur) { $("mascot").src = src; mascot.cur = src; }
    const tag = $("face").className === "idle" && MOOD_TAG[name] ? MOOD_TAG[name] : STATE_TAG[$("face").className] || "Ready";
    if ($("stateTag").textContent !== tag) $("stateTag").textContent = tag;
    setTimeout(mascotTick, 70);
  }
  async function loadMascot() {
    try {
      const r = await fetch("/mascot/manifest.json");
      if (!r.ok) return;
      mascot.m = await r.json();
      for (const [n, e] of Object.entries(mascot.m.emotions))
        for (const f of [...e.frames, ...(e.blink || [])]) { const im = new Image(); im.src = `/mascot/${n}/${f}`; }
      mascotTick();
    } catch (e) { /* no sprites: the first frame stays */ }
  }
  loadMascot();

  let lastReported = null, reportTimer = null;
  function face(s) {
    $("face").className = s;
    mascot.lastActive = performance.now();
    if (!state.token || s === lastReported) return;
    clearTimeout(reportTimer);
    reportTimer = setTimeout(() => {           // tell the laptop so the Raspberry Pi face follows along
      lastReported = s;
      api("/api/v1/events/state", { method: "POST", headers: { "Content-Type": "application/json" },
                                     body: JSON.stringify({ state: s }) }).catch(() => {});
    }, 120);
  }
  function hint(t) { $("hint").textContent = t || ""; }
  function bubble(cls, text) {
    const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
  }
  function meta(el, text) { const m = document.createElement("span"); m.className = "meta"; m.textContent = text; el.appendChild(m); }
  function note(text) { bubble("note", text); }
  function savePrefs() { localStorage.setItem(PREFS, JSON.stringify(prefs)); }
  const hasTamil = s => /[஀-௿]/.test(s);

  async function api(path, opts = {}) {
    opts.headers = Object.assign({}, opts.headers || {}, state.token ? { Authorization: "Bearer " + state.token } : {});
    const r = await fetch(path, opts);
    if (r.status === 401) { localStorage.removeItem(TOKEN); state.token = null; openPair(); throw new Error("not paired"); }
    return r;
  }

  // ------------------------------------------------------------------ pairing
  function openPair() {
    $("pairSheet").classList.add("open"); status("pairing", "warn");
    fetch("/api/v1/web/hello", { method: "POST" }).then(r => r.json()).then(j => {
      $("pairMsg").textContent = j.locked ? "Pairing is locked after wrong codes. Restart the AIRA server."
                                          : "The code is printed in the server window.";
    }).catch(() => {});
  }
  $("pairBtn").onclick = async () => {
    const code = $("code").value.replace(/\D/g, "");
    if (code.length !== 6) { $("pairMsg").textContent = "The code has 6 digits."; return; }
    const r = await fetch("/api/v1/web/pair", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, name: $("devname").value || navigator.platform || "browser" }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $("pairMsg").textContent = j.detail || "Pairing failed"; return; }
    state.token = j.token; localStorage.setItem(TOKEN, j.token);
    $("pairSheet").classList.remove("open"); init();
  };

  // ------------------------------------------------------------------ settings
  function applyPrefsToUI() {
    $("sttSel").value = prefs.stt; $("ttsSel").value = prefs.tts; $("langSel").value = prefs.lang;
    $("autoStop").checked = prefs.autoStop; $("convo").checked = prefs.convo; $("rate").value = prefs.rate;
  }
  ["sttSel", "ttsSel", "langSel"].forEach(id => $(id).onchange = e => { prefs[{ sttSel: "stt", ttsSel: "tts", langSel: "lang" }[id]] = e.target.value; savePrefs(); describeModes(); });
  $("autoStop").onchange = e => { prefs.autoStop = e.target.checked; savePrefs(); };
  $("convo").onchange = e => { prefs.convo = e.target.checked; savePrefs(); };
  $("rate").oninput = e => { prefs.rate = +e.target.value; savePrefs(); };
  $("setBtn").onclick = () => { applyPrefsToUI(); $("setSheet").classList.add("open"); };
  $("closeSet").onclick = () => $("setSheet").classList.remove("open");
  $("forgetBtn").onclick = () => { localStorage.removeItem(TOKEN); location.reload(); };
  $("newBtn").onclick = async () => {
    stopAll();
    if (state.session) api("/api/v1/sessions/" + state.session, { method: "DELETE" }).catch(() => {});
    state.session = null; $("log").innerHTML = ""; note("New conversation");
  };

  function sttMode() {
    if (prefs.stt === "server") return state.caps.stt ? "server" : (SR ? "browser" : "none");
    if (prefs.stt === "browser") return SR ? "browser" : (state.caps.stt ? "server" : "none");
    return state.caps.stt ? "server" : (SR ? "browser" : "none");
  }
  function ttsMode() {
    if (prefs.tts === "off") return "off";
    if (prefs.tts === "server") return state.caps.tts ? "server" : "browser";
    if (prefs.tts === "browser") return "browser";
    return state.caps.tts ? "server" : ("speechSynthesis" in window ? "browser" : "off");
  }
  function describeModes() {
    const s = sttMode(), t = ttsMode();
    $("capsInfo").textContent = `Server: speech recognition ${state.caps.stt || "not installed"}, voice ${state.caps.tts || "not configured"}.`;
    hint(s === "none" ? "This browser can't do speech recognition and the server has none: type instead."
                      : `Listening via ${s === "server" ? "Whisper on the laptop" : "this browser"} · voice: ${
                          state.voiceUsed || (t === "server" ? state.caps.tts + " on the laptop" : t)}${girl() ? " (girl)" : ""}`);
    $("mic").disabled = s === "none";
  }

  // ------------------------------------------------------------------ init
  async function init() {
    applyPrefsToUI();
    if (!window.isSecureContext) note("This page is not on HTTPS or localhost, so the browser blocks the microphone. Typing still works. See HOW-TO-RUN.md §4.");
    if (!state.token) { openPair(); return; }
    try {
      const r = await api("/api/v1/voice/capabilities");
      state.caps = await r.json();
      const st = await (await api("/api/v1/status")).json();
      status(st.status === "ok" ? `ready · ${st.config.model}` : "AI model not ready — check the server window", st.status === "ok" ? "ok" : "warn");
    } catch (e) { if (e.message !== "not paired") status("cannot reach AIRA server", "bad"); return; }
    describeModes(); face("idle"); listenEvents(); watchPi();
  }

  // ------------------------------------------------------------------ live events (reminders, Pi button)
  let eventsCtrl = null;
  async function listenEvents() {
    if (eventsCtrl) return;
    eventsCtrl = new AbortController();
    for (let delay = 1000; ; delay = Math.min(delay * 2, 30000)) {
      try {
        const r = await api("/api/v1/events", { signal: eventsCtrl.signal });
        if (!r.ok) throw new Error(r.status);
        delay = 1000;
        const reader = r.body.getReader(), dec = new TextDecoder(); let raw = "";
        for (;;) {
          const { value, done } = await reader.read(); if (done) break;
          raw += dec.decode(value, { stream: true });
          let i;
          while ((i = raw.indexOf("\n\n")) >= 0) {
            const block = raw.slice(0, i); raw = raw.slice(i + 2);
            const m = block.match(/^data: (.*)$/m); if (!m) continue;
            onEvent(JSON.parse(m[1]));
          }
        }
      } catch (e) { if (e.name === "AbortError" || e.message === "not paired") return; }
      await new Promise(res => setTimeout(res, delay));
    }
  }
  // ------------------------------------------------------------------ AIRA's Raspberry Pi screen
  let piTimer = null;
  async function watchPi() {
    clearTimeout(piTimer);
    try {
      const r = await api("/api/v1/devices");
      const list = r.ok ? (await r.json()).devices || [] : [];
      const on = list.length > 0, tag = $("piTag");
      tag.classList.toggle("on", on);
      const narrow = matchMedia("(max-width: 600px)").matches;
      // "AIRA Half": the Pi is only a screen (talk on this page); "AIRA Full": the complete handset
      const edition = on ? ((list[0].caps || {}).edition || "") : "";
      const short = edition.replace(/^AIRA\s+/i, "");
      tag.textContent = on ? (edition ? (narrow ? `${short} on` : `${edition} · on`) : (narrow ? "Pi on" : "Pi screen on"))
                           : (narrow ? "Pi off" : "Pi screen off");
      tag.title = on ? `${edition || "AIRA's screen"} connected: ${list.map(d => d.name).join(", ")}` +
                       (/half/i.test(edition) ? " (screen only: you talk to AIRA on this page)" : "")
                     : "AIRA's Raspberry Pi screen is not connected";
      document.querySelectorAll("#piScreens button").forEach(b => b.disabled = !on);
    } catch (e) { if (e.message === "not paired") return; }
    piTimer = setTimeout(watchPi, document.hidden ? 30000 : 8000);
  }
  document.querySelectorAll("#piScreens button").forEach(b => b.onclick = async () => {
    try {
      const r = await api("/api/v1/devices/screen", { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify({ screen: b.dataset.screen }) });
      if (!r.ok) throw new Error(r.status);
      document.querySelectorAll("#piScreens button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      hint(b.dataset.screen === "emotions" ? "AIRA's screen plays through her emotions, 3 seconds each (Home after a minute)"
                                           : `AIRA's screen shows ${b.textContent} (back to Home after a minute)`);
    } catch (e) { if (e.message !== "not paired") hint("Could not reach AIRA's screen"); }
  });

  function onEvent(ev) {
    if (ev.type === "caption" && ev.source && ev.source !== "web") {
      // a conversation started on the Pi's touch screen: show it here and speak the answer, as the Pi has no speaker
      if (ev.role === "user") { meta(bubble("user", ev.text), "on " + ev.source); face("thinking"); status("thinking…", "warn"); }
      else {
        bubble("aira", ev.text);
        speak(ev.text, state.speakGen);
        state.speakQueue.then(() => { if (!state.recording) { face("idle"); status("ready", "ok"); } });
      }
      return;
    }
    if (ev.type === "reminder") {
      const b = bubble("reminder", ev.say || ev.text); b.setAttribute("role", "alert"); mood("excited", 6000);
      stopAll(); speak(ev.say || ev.text, state.speakGen);
      state.speakQueue.then(() => face("idle"));
    } else if (ev.type === "wake" && !state.recording && sttMode() !== "none") {
      note("AIRA's button was pressed — listening");
      $("mic").click();
    }
  }

  // ------------------------------------------------------------------ recording (server STT)
  let rec = null;
  async function startServerRecording() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) { micError(e); return; }
    const mime = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    const chunks = [];
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const t0 = performance.now(); let spoke = false, lastVoice = t0;
    rec = { stream, mr, ctx, timer: null, cancelled: false };
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = async () => {
      clearInterval(rec.timer); stream.getTracks().forEach(t => t.stop()); ctx.close(); $("meter").firstChild.style.width = "0";
      const cancelled = rec.cancelled; rec = null; setRecUI(false);
      if (cancelled || !chunks.length) { face("idle"); return; }
      await sendAudio(new Blob(chunks, { type: mr.mimeType || "audio/webm" }));
    };
    mr.start(250); setRecUI(true);
    rec.timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const rms = Math.sqrt(sum / buf.length), now = performance.now();
      $("meter").firstChild.style.width = Math.min(100, rms * 900) + "%";
      if (rms > 0.02) { spoke = true; lastVoice = now; }
      if (prefs.autoStop) {
        if (spoke && now - lastVoice > 1200) stopRecording();
        else if (!spoke && now - t0 > 8000) { rec && (rec.cancelled = true); stopRecording(); hint("Didn't hear anything."); }
      }
      if (now - t0 > 20000) stopRecording();
    }, 60);
  }
  function stopRecording() { if (rec && rec.mr.state !== "inactive") rec.mr.stop(); }

  async function sendAudio(blob) {
    face("thinking"); status("transcribing…", "warn");
    const fd = new FormData(); fd.append("audio", blob, "utterance"); fd.append("language", prefs.lang);
    try {
      const r = await api("/api/v1/voice/transcribe", { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) { note("Speech recognition failed: " + (j.detail || r.status)); face("error"); status("ready", "ok"); return; }
      if (!j.text.trim()) { note("Didn't catch that."); mood("confused", 3000); face("idle"); status("ready", "ok"); return; }
      await converse(j.text, `heard in ${j.latency_s}s${j.language ? " · " + j.language : ""}`);
    } catch (e) { if (e.message !== "not paired") { note("Upload failed: " + e.message); face("error"); } }
  }

  // ------------------------------------------------------------------ browser STT
  let recog = null;
  function startBrowserRecognition() {
    recog = new SR();
    recog.lang = prefs.lang === "ta" ? "ta-IN" : "en-IN";
    recog.interimResults = true; recog.continuous = !prefs.autoStop; recog.maxAlternatives = 1;
    let interim = null, finalText = "";
    recog.onresult = ev => {
      let t = ""; finalText = "";
      for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else t += r[0].transcript; }
      if (!interim) interim = bubble("user interim", ""); interim.textContent = finalText + t;
    };
    recog.onerror = ev => { if (ev.error === "not-allowed") micError({ name: "NotAllowedError" }); else if (ev.error !== "no-speech" && ev.error !== "aborted") note("Speech recognition: " + ev.error); };
    recog.onend = () => {
      setRecUI(false); if (interim) interim.remove(); recog = null;
      if (finalText.trim()) converse(finalText.trim(), "heard by the browser"); else face("idle");
    };
    recog.start(); setRecUI(true);
  }

  function micError(e) {
    setRecUI(false); face("error");
    note(e && e.name === "NotAllowedError"
      ? (window.isSecureContext ? "Microphone permission denied. Allow it in the browser's site settings." : "Microphone blocked: open AIRA over HTTPS or localhost (HOW-TO-RUN.md §4).")
      : "Microphone unavailable: " + (e && (e.message || e.name)));
  }

  function setRecUI(on) {
    state.recording = on; $("mic").classList.toggle("rec", on);
    if (on) { face("listening"); status("listening… (tap to stop)", "ok"); }
  }

  $("mic").onclick = () => {
    if (state.recording) { recog ? recog.stop() : stopRecording(); return; }
    stopAll();  // barge-in: interrupt AIRA
    const mode = sttMode();
    if (mode === "server") startServerRecording(); else if (mode === "browser") startBrowserRecognition();
  };
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && document.activeElement !== $("text") && !$("pairSheet").classList.contains("open")) { e.preventDefault(); $("mic").click(); }
  });

  // ------------------------------------------------------------------ conversation
  document.querySelectorAll("#quick button").forEach(b => b.onclick = () => { stopAll(); converse(b.dataset.say); });
  $("send").onclick = () => { const t = $("text").value.trim(); if (t) { $("text").value = ""; stopAll(); converse(t); } };
  $("text").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

  const SENT = /([.!?।]+["')\]]*)(\s+)/;
  async function converse(text, how) {
    const u = bubble("user", text); if (how) meta(u, how);
    const a = bubble("aira", ""); face("thinking"); status("thinking…", "warn");
    const at = document.createElement("span"); a.appendChild(at);   // text; chips/buttons go after it
    const ctrl = new AbortController(); state.abort = ctrl; const gen = ++state.speakGen;
    let buffer = "", full = "", stats = null, spokeAny = false;
    const flushSentences = (final) => {
      let m;
      while ((m = SENT.exec(buffer))) { const s = buffer.slice(0, m.index + m[1].length).trim(); buffer = buffer.slice(m.index + m[0].length); if (s) { speak(s, gen); spokeAny = true; } }
      // Start talking sooner: speak the first clause as soon as it ends with a comma (not before 15 characters).
      if (!spokeAny && !final && buffer.length > 18) {
        const c = buffer.indexOf(", ", 15);
        if (c > 0) { speak(buffer.slice(0, c + 1).trim(), gen); buffer = buffer.slice(c + 2); spokeAny = true; }
      }
      if (final && buffer.trim()) { speak(buffer.trim(), gen); buffer = ""; }
    };
    try {
      const r = await api("/api/v1/chat/stream", { method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state.session ? { message: text, session_id: state.session } : { message: text }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || j.message || r.status); }
      const reader = r.body.getReader(), dec = new TextDecoder(); let raw = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        raw += dec.decode(value, { stream: true });
        let i;
        while ((i = raw.indexOf("\n\n")) >= 0) {
          const block = raw.slice(0, i); raw = raw.slice(i + 2);
          const ev = (block.match(/^event: (.*)$/m) || [])[1], data = JSON.parse((block.match(/^data: (.*)$/m) || [, "{}"])[1]);
          if (ev === "start") state.session = data.session_id;
          else if (ev === "token") { full += data.text; buffer += data.text; at.textContent = full; $("log").scrollTop = $("log").scrollHeight; flushSentences(false); }
          else if (ev === "tool") { chip(a, data); if (data.ok) mood("happy", 4000); }
          else if (ev === "confirm") confirmButtons(a);
          else if (ev === "done") stats = data.stats;
          else if (ev === "error") throw new Error(data.message + (data.hint ? " — " + data.hint : ""));
        }
      }
      flushSentences(true);
      if (stats) meta(a, stats.model && stats.model.startsWith("aira-")
        ? `done in ${(stats.client_total_s || 0).toFixed(2)}s${stats.model === "aira-fast" ? " · instant command" : ""}`
        : `${stats.ttft_s != null ? "first word " + stats.ttft_s.toFixed(2) + "s · " : ""}${stats.tokens_per_s} tok/s`);
      status("ready", "ok");
    } catch (e) {
      if (e.name === "AbortError") { meta(a, "(interrupted)"); return; }
      if (e.message === "not paired") return;
      at.textContent = full || "Error: " + e.message; face("error"); status("error", "bad"); return;
    } finally { state.abort = null; }
    state.speakQueue.then(() => {
      if (gen !== state.speakGen) return;
      face("idle");
      if (prefs.convo && sttMode() !== "none") setTimeout(() => !state.recording && gen === state.speakGen && $("mic").click(), 300);
    });
  }

  const TOOL_LABEL = { open_app: "opened app", close_app: "closed app", open_website: "opened website",
    web_search: "web search", system_status: "laptop status", get_datetime: "clock", media_control: "media",
    volume: "volume", brightness: "brightness", set_timer: "timer", set_reminder: "reminder",
    list_reminders: "reminders", cancel_reminder: "cancelled", lock_screen: "locked", power: "power",
    cancel_shutdown: "shutdown cancelled" };
  function chip(el, d) {
    const c = document.createElement("span"); c.className = "chip" + (d.ok ? "" : " fail");
    c.textContent = (TOOL_LABEL[d.name] || d.name) + (d.ok ? "" : " failed") + (d.fast ? " · instant" : "");
    c.title = d.say || ""; el.appendChild(c);
  }
  function confirmButtons(el) {
    const row = document.createElement("div"); row.className = "confirm";
    const yes = document.createElement("button"); yes.className = "yes"; yes.textContent = "Yes, do it";
    const no = document.createElement("button"); no.textContent = "Cancel";
    const answer = word => { row.remove(); stopAll(); converse(word); };
    yes.onclick = () => answer("yes"); no.onclick = () => answer("no");
    row.append(yes, no); el.appendChild(row);
  }

  // ------------------------------------------------------------------ speech output
  function speak(sentence, gen) {
    const mode = ttsMode();
    if (mode === "off") return;
    // Girl style: a browser voice is only used if it is a girl / woman voice for this language;
    // otherwise (e.g. Chrome has only a male Tamil voice) this sentence uses the laptop's girl voice.
    const server = mode === "server" || (girl() && state.caps.tts && !pickVoice(sentence));
    if (server) {
      const audioP = api("/api/v1/voice/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: sentence }) })
        .then(r => r.ok ? r.blob() : Promise.reject(new Error("tts " + r.status))).catch(e => e);  // fetch starts now, plays in order
      state.speakQueue = state.speakQueue.then(async () => {
        if (gen !== state.speakGen) return;
        const blob = await audioP;
        if (blob instanceof Error) {                     // this sentence in the browser; give up on the server after 3 in a row
          if (++state.ttsFails >= 3 && state.caps.tts) {
            state.caps.tts = null; describeModes();
            note("The laptop voice keeps failing; using the browser voice. Check the server window.");
          }
          return browserSay(sentence, gen);
        }
        state.ttsFails = 0;
        if (state.voiceUsed !== "") { state.voiceUsed = ""; describeModes(); }
        return playBlob(blob, gen);
      });
    } else state.speakQueue = state.speakQueue.then(() => browserSay(sentence, gen));
  }
  function playBlob(blob, gen) {
    return new Promise(res => {
      if (gen !== state.speakGen) return res();
      const url = URL.createObjectURL(blob), au = new Audio(url); state.audio = au;
      au.onplay = () => { face("speaking"); status("speaking… (tap the mic to interrupt)", "ok"); };
      const end = () => { URL.revokeObjectURL(url); if (state.audio === au) state.audio = null; res(); };
      au.onended = end; au.onerror = end; au.play().catch(end);
    });
  }
  const girl = () => state.caps.voice_style === "girl";
  // Windows / Chrome / Edge / Android voice names. Male ones are never used for AIRA's girl voice.
  const CHILD = /\bAna\b|child|kid|girl/i;
  const FEMALE = /\b(Ana|Aria|Jenny|Zira|Heera|Neerja|Pallavi|Swara|Kalpana|Shruti|Sara|Michelle|Emma|Ava|Libby|Sonia|Maisie|Natasha|Clara|Samantha|Karen|Moira|Tessa|Veena|Lekha|Kanya|Female|Woman)\b/i;
  const MALE = /\b(David|Mark|Ravi|Valluvar|Guy|Prabhat|Madhur|Daniel|Alex|Fred|Rishi|George|James|Ryan|Eric|Christopher|Roger|Steffan|Thomas|Brian|Andrew|Male|Man)\b/i;
  function pickVoice(text) {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices(), ta = hasTamil(text);
    const forLang = voices.filter(v => v.lang.replace("_", "-").startsWith(ta ? "ta" : "en"));
    if (girl()) {
      const child = !ta && forLang.find(v => CHILD.test(v.name) && !MALE.test(v.name));
      if (child) return child;                        // Edge: "Microsoft Ana Online (Natural)", a real child voice
      const rank = v => (v.lang.endsWith("IN") ? 0 : 2) + (/Natural|Online|Google/i.test(v.name) ? 0 : 1);
      return forLang.filter(v => FEMALE.test(v.name) && !MALE.test(v.name)).sort((a, b) => rank(a) - rank(b))[0] || null;
    }
    return (ta ? forLang[0] : null) || voices.find(v => v.lang === "en-IN") || forLang[0] || null;
  }
  function browserSay(text, gen) {
    return new Promise(res => {
      if (gen !== state.speakGen || !("speechSynthesis" in window)) return res();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(text); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = hasTamil(text) ? "ta-IN" : "en-IN";
      const childVoice = v && CHILD.test(v.name);
      // no girl voice here at all: the browser default may be a man's voice, so lift it as far as it goes
      u.rate = prefs.rate; u.pitch = girl() ? (childVoice ? 1.2 : v ? 1.6 : 2) : 1.15;
      u.onstart = () => {
        face("speaking"); status("speaking… (tap the mic to interrupt)", "ok");
        const name = "browser: " + (v ? v.name.replace(/^Microsoft |\s*\(.*\)| - .*$/g, "") : "default");
        if (state.voiceUsed !== name) { state.voiceUsed = name; describeModes(); }
      };
      u.onend = res; u.onerror = res;
      speechSynthesis.speak(u);
    });
  }
  function stopAll() {
    state.speakGen++;
    if (state.abort) state.abort.abort();
    if (state.audio) { state.audio.pause(); state.audio = null; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    state.speakQueue = Promise.resolve();
    if (!state.recording) face("idle");
  }
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

  init();
})();
</script>
</body>
</html>
